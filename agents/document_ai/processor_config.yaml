# Google Document AI Custom Classifier configuration.
# Secrets (project_id, processor_id, credentials path) stay in .env — not here.
# This file captures non-secret AI config so it is reviewable and diffable in git.

location: us                  # "us" or "eu"
confidence_threshold: 0.6     # minimum confidence to accept a Document AI prediction
xlsx_rule_threshold: 0.5      # minimum keyword hit ratio to accept a rule-based classification

supported_mime_types:
  - application/pdf
  - image/jpeg
  - image/png
  - image/gif
  - image/tiff
  - image/bmp
  - image/webp
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document

# XLSX files are NOT sent to Document AI — they are classified locally via
# keyword rules defined in prompts/rules/*.yaml
xlsx_handled_locally: true
